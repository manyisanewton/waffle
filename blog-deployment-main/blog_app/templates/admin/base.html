<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    {% if csrf_token %}<meta name="csrf-token" content="{{ csrf_token }}" />{% endif %}
    <title>{% block title %}Vortexus Blog Studio{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='admin/admin.css') }}" />
  </head>
  <body data-page="{% block page_name %}admin{% endblock %}" data-app-root="{{ request.script_root }}">
    {% block body %}{% endblock %}
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="{{ url_for('static', filename='admin/admin.js') }}" defer></script>
  </body>
</html>
